<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1170" viewBox="0 0 1800 1170" role="img" aria-labelledby="heading description"><title id="heading">Project Olympus V1: source-grounded physical and operational architecture</title><desc id="description">Detailed two node private Linux homelab diagram. MacBook Pro administrative client and manual backup destination, ATLAS late-2012 Intel Mac mini running Debian 13, and HERMES Intel NUC running Debian 13. All connect separately to existing home router Wi-Fi, and HERMES completed one small synthetic Python computation. Distinguishes verified administration and backup flows from future workload roles. No invented IP addresses or internet exposure claims.</desc><defs>
