 Neue, Arial, sans-serif" font-size="15" font-weight="750" text-anchor="start">SOFTWARE</text><text x="1379" y="703" fill="#253b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="540" text-anchor="start">Debian 13  ·  SSH / Cockpit</text><text x="1224" y="742" fill="#697d93" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="750" text-anchor="start">NETWORK</text><text x="1379" y="742" fill="#253b50" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="540" text-anchor="start">Intel Wireless 3165  ·  iwlwifi</text><rect x="54" y="804" width="1692" height="245" rx="20" fill="#ffffff" stroke="#e0e8f1" stroke-width="2"/><text x="81" y="837" fill="#71849a" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="start" letter-spacing="1.5">02  VERIFIED CONTROL AND DATA FLOWS</text><rect x="81" y="862" width="515" height="151" rx="14" fill="#edf5fd" stroke="#d8e5ee" stroke-width="1.5"/><rect x="97" y="879" width="6" height="30" rx="3" fill="#286aab" stroke="none" stroke-width="1.5"/><text x="118" y="901" fill="#172b40" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="780" text-anchor="start">REMOTE ADMINISTRATION</text><text x="102" y="936" fill="#286aab" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="730" text-anchor="start">MacBook → ATLAS / HERMES</text><text x="102" y="970" fill="#3b526a" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Key-based SSH on the private LAN</text><text x="102" y="994" fill="#3b526a" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Cockpit dashboards through SSH tunnels</text><rect x="643" y="862" width="515" height="151" rx="14" fill="#eaf7f1" stroke="#d8e5ee" stroke-width="1.5"/><rect x="659" y="879" width="6" hei